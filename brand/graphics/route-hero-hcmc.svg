<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" fill="none" role="img" aria-label="Folded Return-M Corridor unified brand mechanism">
  <rect width="960" height="270" fill="#FBF8F1" stroke="#D8D2C4" stroke-width="1"/>
  <!-- 1. Top QĐ 23/2018 Curfew Time Clock Ribbon -->
  <rect x="32" y="18" width="896" height="24" fill="#ECE5D7" stroke="#D8D2C4" stroke-width="1"/>
  <rect x="32" y="18" width="224" height="24" fill="#EEF2FC"/>
  <rect x="256" y="18" width="112" height="24" fill="#FDF3E7"/>
  <rect x="256" y="18" width="112" height="3" fill="#A64B08"/>
  <rect x="368" y="18" width="262" height="24" fill="#EAF5EE"/>
  <rect x="368" y="18" width="262" height="3" fill="#0B7A3B"/>
  <rect x="630" y="18" width="150" height="24" fill="#FDF3E7"/>
  <rect x="630" y="18" width="150" height="3" fill="#A64B08"/>
  <rect x="780" y="18" width="148" height="24" fill="#EEF2FC"/>
  <text x="144" y="34" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#1B45D7">00–06 MỞ</text>
  <text x="312" y="34" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#A64B08">06–09 CẤM TẢI</text>
  <text x="499" y="34" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#0B7A3B">09–16 HÀNH LANG MỞ QĐ 23</text>
  <text x="705" y="34" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#A64B08">16–20 CẤM TẢI</text>
  <text x="854" y="34" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#1B45D7">20–24 MỞ</text>

  <!-- 2. Faint Structural Cadence Grid -->
  <line x1="256" y1="42" x2="256" y2="230" stroke="#D8D2C4" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="499" y1="42" x2="499" y2="230" stroke="#D8D2C4" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="742" y1="42" x2="742" y2="230" stroke="#D8D2C4" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 3. Enclosed Return-M Cargo Bay (Green Certifies Verified Yield ONLY) -->
  <path d="M256 190 V78 L499 144 L742 78 V190 H256 Z" fill="#0B7A3B" fill-opacity="0.08"/>

  <!-- 4. Legacy Empty-Return Deadhead Ghost Below Baseline -->
  <path d="M256 194 C360 226 638 226 742 194" stroke="#B42318" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="499" y="229" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#B42318">TRƯỚC ECOMILES: CHẠY RỖNG 32,8% · 374,4 KM · 28 LỖI QĐ 23</text>

  <!-- 5. The Folded Return-M Route Path (Outbound Peak -> Matched Return Bridge) -->
  <path d="M120 190 H256 V78 L499 144 L742 78 V190" stroke="#101418" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M742 190 H256" stroke="#1B45D7" stroke-width="5" stroke-linecap="square"/>
  <path d="M742 190 H852" stroke="#0B7A3B" stroke-width="3.5" stroke-linecap="square"/>

  <!-- 6. Telemetry Stop Nodes -->
  <circle cx="120" cy="190" r="6" fill="#101418"/>
  <circle cx="256" cy="78" r="6" fill="#101418"/>
  <circle cx="499" cy="144" r="6.5" fill="#1B45D7"/>
  <circle cx="742" cy="78" r="6" fill="#101418"/>
  <rect x="249" y="183" width="14" height="14" fill="#0B7A3B"/>
  <rect x="846" y="183" width="14" height="14" fill="#0B7A3B"/>

  <!-- 7. Precise Callouts -->
  <text x="120" y="174" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#101418">CÁT LÁI 05:30</text>
  <text x="256" y="66" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#101418">SÓNG THẦN</text>
  <text x="499" y="128" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#1B45D7">GHÉP ĐƠN VỀ</text>
  <text x="742" y="66" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#101418">KCN TÂN BÌNH</text>
  <text x="499" y="177" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#0B7A3B">M ĐÓNG VÒNG · 243,7 KM (−34,9%) · RỖNG 2,7%</text>
  <text x="853" y="172" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#0B7A3B">56,66 kg CO₂e</text>
  <text x="853" y="213" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#5B5F66">ISO 14083 SEAL</text>
</svg>
