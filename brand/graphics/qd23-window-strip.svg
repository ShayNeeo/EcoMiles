  <text x="480" y="48" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#A64B08">16:00 CẤM</text>
  <text x="600" y="48" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="600" fill="#5B5F66">20:00 MỞ</text>
