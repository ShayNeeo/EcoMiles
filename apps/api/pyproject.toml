[project]
name = "greenlogix-api"
version = "0.1.0"
description = "GreenLogix FastAPI dispatcher + VRP skeleton (Python 3.12)"
readme = "README.md"
authors = [
    { name = "ShayNeeo", email = "phamquocthanh357@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
pdf = [
    "weasyprint>=70.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["B", "I", "SIM"]
extend-ignore = ["B008", "BLE001", "DTZ001"]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
